name: Mirror Upstream Releases

# 从 kiroswu/hongguo-shortdramabox 镜像全部 Release 及附件到本仓库。
# 按发布时间从旧到新处理，保证上游最新版本成为本仓库的 latest。
# 已存在且 SHA256 未变化的文件会跳过，不会每小时重复上传。

on:
  schedule:
    - cron: "17 * * * *"   # 每小时检查一次
  workflow_dispatch:
    inputs:
      limit:
        description: "只镜像最近 N 个版本（填 0 或留空表示全部）"
        required: false
        default: "0"

concurrency:
  group: mirror-releases
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM: kiroswu/hongguo-shortdramabox

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Mirror all releases and assets
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          set -euo pipefail

          echo "读取上游 Release 列表：$UPSTREAM"
          gh api "repos/${UPSTREAM}/releases?per_page=100" > releases.json

          # 从旧到新排序，最后创建的版本才会成为本仓库的 latest
          mapfile -t TAGS < <(jq -r 'sort_by(.published_at) | .[].tag_name' releases.json)

          if [[ "${LIMIT:-0}" =~ ^[1-9][0-9]*$ ]]; then
            START=$(( ${#TAGS[@]} - LIMIT ))
            (( START < 0 )) && START=0
            TAGS=("${TAGS[@]:START}")
          fi

          echo "待镜像 ${#TAGS[@]} 个版本：${TAGS[*]}"

          for TAG in "${TAGS[@]}"; do
            jq -c --arg tag "$TAG" '.[] | select(.tag_name == $tag)' releases.json > release.json
            TITLE=$(jq -r '.name // .tag_name' release.json)
            jq -r '.body // ""' release.json > body.md
            {
              echo
              echo "---"
              echo
              printf '> 本 Release 自动镜像自 [%s v%s](https://github.com/%s/releases/tag/%s)，内容以上游为准。\n' \
                "$UPSTREAM" "$TAG" "$UPSTREAM" "$TAG"
            } >> body.md

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "== $TAG 已存在，检查差异 =="
            else
              echo "== 创建 $TAG =="
              gh release create "$TAG" --title "$TITLE" --notes-file body.md
            fi

            # 每次都同步标题和说明（上游改 Release Notes 时也能跟上）
            gh release edit "$TAG" --title "$TITLE" --notes-file body.md

            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > local.json
            jq -r '.assets[] | select(.state == "uploaded") | [.name, (.digest // ""), (.size | tostring)] | @tsv' local.json > local.tsv

            jq -r '.assets[] | select(.state == "uploaded") | [.name, (.digest // ""), (.size | tostring), .browser_download_url] | @tsv' release.json > upstream.tsv

            while IFS=$'\t' read -r NAME DIGEST SIZE URL; do
              [[ -z "$NAME" ]] && continue
              HASH="${DIGEST#sha256:}"

              # 已有同内容文件则跳过：优先比 SHA256，没有摘要时退回比文件大小
              if awk -F '\t' -v n="$NAME" -v h="$HASH" -v s="$SIZE" '
                $1 == n {
                  lh = $2; sub(/^sha256:/, "", lh)
                  if (h != "" && lh == h) found = 1
                  else if (h == "" && lh == "" && $3 == s) found = 1
                }
                END { exit(found ? 0 : 1) }
              ' local.tsv; then
                echo "  跳过 $NAME（内容未变）"
                continue
              fi

              echo "  下载 $NAME"
              curl -fL --retry 3 --retry-delay 2 -o "$NAME" "$URL"

              if [[ -n "$HASH" ]]; then
                ACTUAL=$(sha256sum "$NAME" | cut -d' ' -f1)
                if [[ "$ACTUAL" != "$HASH" ]]; then
                  echo "  $NAME 校验失败：期望 $HASH，实际 $ACTUAL" >&2
                  exit 1
                fi
              fi

              echo "  上传 $NAME 到 $TAG"
              gh release upload "$TAG" "$NAME" --clobber
              rm -f "$NAME"
            done < upstream.tsv
          done

          echo "镜像完成：${#TAGS[@]} 个版本"
